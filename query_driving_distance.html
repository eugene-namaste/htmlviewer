<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Query by Address + Driving Distance</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css">
  <style>
    html, body, #viewDiv { padding:0; margin:0; height:100%; width:100%; }
    #sidebar {
      position: absolute; top: 10px; left: 10px; width: 420px;
      background: white; box-shadow: 0 0 15px rgba(0,0,0,0.3);
      z-index: 10; padding: 15px; border-radius: 8px;
      max-height: 92vh; overflow-y: auto;
    }
    button, input { width: 100%; padding: 9px; margin-bottom: 12px; }
    #status { padding: 12px; background: #f0f0f0; border-radius: 4px; margin: 10px 0; }
  </style>
</head>
<body>
  <div id="viewDiv"></div>

  <div id="sidebar">
    <h2>Address + Driving Distance</h2>
    <div id="instructions" style="margin-bottom:15px; font-size:13.5px;">
      1. Enter address + distance<br>
      2. Click "Create Drive Polygon"<br>
      3. Click "Find Features"
    </div>

    <button id="clearBtn">Clear All</button>

    <div id="filters"></div>

    <button id="createDriveBtn" style="background:#28a745;color:white;">Geocode &amp; Create Drive Polygon</button>
    <button id="queryBtn" style="background:#007ac2;color:white;margin-top:8px;">Find Features Inside Drive Area</button>

    <div id="results">
      <h3>Results: <span id="count">0</span> features</h3>
      <div id="featureList"></div>
    </div>

    <div id="status">Initializing map...</div>
  </div>

  <script src="https://js.arcgis.com/4.31/"></script>
  <script>
    require([
      "esri/Map", "esri/views/MapView",
      "esri/layers/GraphicsLayer", "esri/layers/FeatureLayer",
      "esri/Graphic", "esri/symbols/SimpleFillSymbol", "esri/symbols/SimpleMarkerSymbol",
      "esri/rest/locator", "esri/rest/serviceArea", "esri/rest/support/ServiceAreaParameters",
      "esri/rest/support/FeatureSet", "esri/config"
    ], function(
      Map, MapView,
      GraphicsLayer, FeatureLayer,
      Graphic, SimpleFillSymbol, SimpleMarkerSymbol,
      locator, serviceArea, ServiceAreaParameters, FeatureSet, esriConfig
    ) {

      const config = {
        queryLayerUrl: "https://services1.arcgis.com/ejbgqcCL0yNBugWr/arcgis/rest/services/fire_zones_stations/FeatureServer/1",
        apiKey: "AAPTaMBm8u2ty8SIqSbFzFjcZFA..xW9B6dwGWRq8BZZ_hPuk7UcgXTwVpEMNxSeFRl25mes2m0CGyMyaw9io_Hy_0PNRLiD5H0H8tU06XilEyY67lN3L8IHvonRFfYDBiOVHzBEk1RDJw8OzmfCPRoYvC0Lzr6U-gr0x4ARIWX52MFfjuHLe8N5vcdtUQRNCOjFPFjoXN8WAjLZBjz25Ccyjrvh4Om5znJcfHCPql5aexng27E2KCow2c1LA-QIx3hyQXrf1dJJb2tZpE3AVQXGoheA-9Q..AT1_iqoDCp4v",   // ←←← PUT YOUR REAL KEY HERE

        geocodingUrl: "https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer",
        serviceAreaUrl: "https://route-api.arcgis.com/arcgis/rest/services/World/ServiceAreas/NAServer/ServiceArea_World"
      };

      // Set API Key
      if (config.apiKey && config.apiKey !== "YOUR_ARCGIS_API_KEY_HERE") {
        esriConfig.apiKey = config.apiKey;
      }

      const map = new Map({ basemap: "topo-vector" });
      const view = new MapView({ container: "viewDiv", map: map, center: [-81.37, 28.29], zoom: 9 });

      const graphicsLayer = new GraphicsLayer();
      map.add(graphicsLayer);

      let currentDrivePolygon = null;

      function updateStatus(msg) {
        document.getElementById("status").textContent = msg;
      }

      document.getElementById("filters").innerHTML = `
        <h3>Address</h3>
        <input type="text" id="addressInput" value="1163 Liberty Hall Dr, Kissimmee, FL 34746">
        <h3>Driving Distance (miles)</h3>
        <input type="number" id="distanceInput" value="5" min="0.1" step="0.1">
      `;

      async function createDrivePolygon() {
        const address = document.getElementById("addressInput").value.trim();
        const distance = parseFloat(document.getElementById("distanceInput").value);

        if (!address) return alert("Please enter an address");

        updateStatus("Geocoding...");

        try {
          const candidates = await locator.addressToLocations(config.geocodingUrl, {
            singleLine: address,
            maxLocations: 1
          });

          if (candidates.length === 0) throw new Error("Address not found");

          const point = candidates[0].location;

          graphicsLayer.removeAll();
          graphicsLayer.add(new Graphic({ geometry: point, symbol: new SimpleMarkerSymbol({ color: "blue", size: 12 }) }));
          view.goTo(point);

          updateStatus("Creating drive polygon...");

          const params = new ServiceAreaParameters({
            facilities: new FeatureSet({ features: [new Graphic({ geometry: point })] }),
            defaultBreaks: [distance],
            travelMode: "Driving Distance"
          });

          const result = await serviceArea.solve(config.serviceAreaUrl, params);

          if (result.serviceAreaPolygons.features.length > 0) {
            currentDrivePolygon = result.serviceAreaPolygons.features[0].geometry;

            graphicsLayer.add(new Graphic({
              geometry: currentDrivePolygon,
              symbol: new SimpleFillSymbol({ color: [0,123,255,0.25], outline: {color:[0,123,255], width:3} })
            }));

            updateStatus(`✅ Drive polygon created (${distance} miles)`);
          }
        } catch (err) {
          console.error(err);
          updateStatus("Error: " + err.message);
        }
      }

      document.getElementById("createDriveBtn").addEventListener("click", createDrivePolygon);
      document.getElementById("clearBtn").addEventListener("click", () => graphicsLayer.removeAll());

      view.when(() => updateStatus("✅ Ready"));
    });
  </script>
</body>
</html>
