<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Query by Address + Driving Distance</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css">
  <style>
    html, body, #viewDiv { padding:0; margin:0; height:100%; width:100%; }
    #sidebar {
      position: absolute; top: 10px; left: 10px; width: 420px;
      background: white; box-shadow: 0 0 15px rgba(0,0,0,0.3);
      z-index: 10; padding: 15px; border-radius: 8px;
      max-height: 92vh; overflow-y: auto; font-family: system-ui, sans-serif;
    }
    h2, h3 { margin: 8px 0 6px 0; }
    button { padding: 8px 12px; margin: 5px 2px; font-size: 14px; }
    select, input { width: 100%; margin-bottom: 10px; padding: 5px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; cursor: pointer; }
    th, td { border: 1px solid #ddd; padding: 7px 6px; text-align: left; }
    th { background: #f4f4f4; }
    tr:hover { background-color: #f0f8ff; }
    #instructions { font-size: 13.5px; line-height: 1.4; color: #444; }
    #status { font-size: 13px; margin-top: 10px; padding: 8px; border-radius: 4px; background: #f8f8f8; }
    .input-group { margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="viewDiv"></div>

  <div id="sidebar">
    <h2>Address + Driving Distance Query</h2>
    <div id="instructions">
      1. Enter an address and driving distance (miles)<br>
      2. Click "Create Drive Polygon"<br>
      3. (Optional) Select STAFF / APPARATUS filters<br>
      4. Click "Find Features Inside Drive Area"
    </div>

    <button id="clearBtn" class="esri-button">Clear All</button>

    <div id="filters"></div>

    <button id="queryBtn" class="esri-button" style="background:#007ac2;color:white;width:100%;margin:12px 0;">
      Find Features Inside Drive Area
    </button>

    <div id="results">
      <h3>Results: <span id="count">0</span> features</h3>
      <div id="featureList"></div>
    </div>

    <div id="status">Initializing map...</div>
  </div>

  <script src="https://js.arcgis.com/4.31/"></script>
  <script>
    require([
      "esri/Map", "esri/views/MapView", "esri/widgets/LayerList",
      "esri/layers/GraphicsLayer", "esri/layers/FeatureLayer",
      "esri/Graphic", "esri/symbols/SimpleFillSymbol", "esri/symbols/SimpleMarkerSymbol",
      "esri/rest/locator", "esri/rest/serviceArea", "esri/rest/support/ServiceAreaParameters",
      "esri/rest/support/FeatureSet", "esri/config"
    ], function(
      Map, MapView, LayerList,
      GraphicsLayer, FeatureLayer,
      Graphic, SimpleFillSymbol, SimpleMarkerSymbol,
      locator, serviceArea, ServiceAreaParameters,
      FeatureSet, esriConfig
    ) {

      const config = {
        queryLayerUrl: "https://services1.arcgis.com/ejbgqcCL0yNBugWr/arcgis/rest/services/fire_zones_stations/FeatureServer/1",
        backdropLayerUrl: "https://services1.arcgis.com/ejbgqcCL0yNBugWr/arcgis/rest/services/fire_zones_stations/FeatureServer/0",

        filterFields: ["STAFF", "APPARATUS"],
        predefinedFilters: { "STAFF": [], "APPARATUS": [] },
        displayFields: [
          { name: "NAME", label: "Station Name" },
          { name: "COMPANY", label: "Company" },
          { name: "STAFF", label: "Staff" },
          { name: "APPARATUS", label: "Apparatus" }
        ],

        apiKey: "AAPTaMBm8u2ty8SIqSbFzFjcZFA..xW9B6dwGWRq8BZZ_hPuk7UcgXTwVpEMNxSeFRl25mes2m0CGyMyaw9io_Hy_0PNRLiD5H0H8tU06XilEyY67lN3L8IHvonRFfYDBiOVHzBEk1RDJw8OzmfCPRoYvC0Lzr6U-gr0x4ARIWX52MFfjuHLe8N5vcdtUQRNCOjFPFjoXN8WAjLZBjz25Ccyjrvh4Om5znJcfHCPql5aexng27E2KCow2c1LA-QIx3hyQXrf1dJJb2tZpE3AVQXGoheA-9Q..AT1_iqoDCp4v",   // ← Change this to your real key later

        geocodingUrl: "https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer",
        serviceAreaUrl: "https://route-api.arcgis.com/arcgis/rest/services/World/ServiceAreas/NAServer/ServiceArea_World"
      };

      if (config.apiKey && config.apiKey !== "xyz") {
        esriConfig.apiKey = config.apiKey;
      }

      const map = new Map({ basemap: "topo-vector" });
      const view = new MapView({ container: "viewDiv", map: map, center: [-81.5, 28.5], zoom: 8 });

      const graphicsLayer = new GraphicsLayer();
      const backdropLayer = new FeatureLayer({ url: config.backdropLayerUrl, opacity: 0.4 });
      const queryLayer = new FeatureLayer({ url: config.queryLayerUrl, outFields: ["*"] });

      map.add(backdropLayer);
      map.add(queryLayer);
      map.add(graphicsLayer);

      let currentDrivePolygon = null;
      let selectionGraphics = [];

      function updateStatus(msg, color = "#0066cc") {
        const el = document.getElementById("status");
        el.style.color = color;
        el.innerHTML = msg;
      }

      function createUI() {
        const container = document.getElementById("filters");
        container.innerHTML = `
          <div class="input-group">
            <h3>Address</h3>
            <input type="text" id="addressInput" value="1 Courthouse Square, Kissimmee, FL">
          </div>
          <div class="input-group">
            <h3>Driving Distance (miles)</h3>
            <input type="number" id="distanceInput" value="5" min="0.1" step="0.1">
          </div>

          <button id="createDriveBtn" class="esri-button" style="background:#28a745;color:white;width:100%;margin-bottom:15px;">
            Geocode &amp; Create Drive Polygon
          </button>
        `;

        config.filterFields.forEach(field => {
          const div = document.createElement("div");
          div.style.marginBottom = "18px";
          div.innerHTML = `<h3>${field}</h3><select id="select_${field}" multiple size="6"></select>`;
          container.appendChild(div);
        });
      }

      async function populateFilters() {
        for (const field of config.filterFields) {
          const select = document.getElementById(`select_${field}`);
          if (config.predefinedFilters[field] && config.predefinedFilters[field].length > 0) {
            select.innerHTML = config.predefinedFilters[field].map(v => `<option value="${v}">${v}</option>`).join('');
          }
        }
      }

      async function createDrivePolygon() {
        const address = document.getElementById("addressInput").value.trim();
        const distanceMiles = parseFloat(document.getElementById("distanceInput").value);

        if (!address) return alert("Please enter an address");

        updateStatus("Geocoding...");

        try {
          const candidates = await locator.addressToLocations(config.geocodingUrl, {
            singleLine: address,
            maxLocations: 1
          });

          if (candidates.length === 0) throw new Error("Address not found");

          const point = candidates[0].location;

          graphicsLayer.removeAll();
          graphicsLayer.add(new Graphic({ geometry: point, symbol: new SimpleMarkerSymbol({ color: "blue", size: 12 }) }));
          view.goTo(point);

          updateStatus("Creating drive polygon...");

          const params = new ServiceAreaParameters({
            facilities: new FeatureSet({ features: [new Graphic({ geometry: point })]
